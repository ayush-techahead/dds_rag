services:

  mongodb:
    image: mongo:7
    container_name: rag_chatbot_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: rag_chatbot_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  backend:
    build: .
    container_name: rag_chatbot_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Compose network hostnames (override localhost-oriented .env for host dev)
      MONGODB_URI: mongodb://mongodb:27017
      QDRANT_URL: http://qdrant:6333
    volumes:
      - backend_storage:/app/storage
    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongodb_data:
  qdrant_data:
  backend_storage:
